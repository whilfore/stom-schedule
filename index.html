<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#151c27">
<title>Расписание</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#151c27;--card:#1d2738;--line:#2a3548;--ink:#f3f6fa;--mute:#8693a7;--soft:#c9d2de;--acc:#4f9de6;--blue:#5aa3ec;--pill:#263349;--bar:#0f141d}
*{box-sizing:border-box;min-width:0}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.3 -apple-system,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{max-width:430px;margin:0 auto;padding:20px 16px 130px}

/* шапка */
.tabs{display:flex;gap:16px;font-size:25px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
.tabs button{border:0;background:none;padding:0;font:inherit;color:#3d4b60;letter-spacing:inherit;transition:color .2s}
.tabs button.on{color:var(--ink)}
.grp{margin-top:18px;display:flex;align-items:center;gap:12px;width:100%;height:55px;padding:0 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left}
.grp svg{flex:none;color:var(--acc)}
.grp i svg{color:#6b788c}
.grp small{display:block;font-size:12px;color:var(--mute);line-height:1.15}
.grp b{display:block;font-size:16.5px;font-weight:700;line-height:1.2}
.grp i{margin-left:auto;color:var(--mute);font-style:normal;display:flex}

/* неделя и дни */
.week{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.nav{width:43px;height:43px;border-radius:50%;border:1px solid #2c3a50;background:transparent;display:grid;place-items:center;flex:none;padding:0;color:var(--ink)}
.nav:disabled{border-color:transparent;background:#18202c;color:#4a576a;cursor:default}
.wk{font-size:15px;font-weight:700;white-space:nowrap}
.wk span{font-size:12px;font-weight:600;color:var(--mute);margin-left:6px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px}
.day{height:61px;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
.day small{font-size:13px;color:var(--mute)}
.day b{font-size:19px;font-weight:700;color:var(--soft);line-height:1}
.day.off b{color:#5f6d82}
.day.today small,.day.today b{color:var(--blue)}
.day.today b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.day.sel{background:#263449}
.day.sel.today{background:#5a9fe2}.day.sel.today small{color:#dbeafb}.day.sel.today b{color:#fff}
.dh{margin:19px 0 0;font-size:15px;font-weight:700;color:#8e9ab0}
.dc{margin:5px 0 0;font-size:14px;color:var(--mute)}
.dc:empty{display:none}

/* статус */
.status{margin-top:14px;background:var(--card);border:1px solid #2c4364;border-radius:18px;padding:15px 15px 14px}
.status b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.status span{display:block;margin-top:5px;font-size:13.5px;color:var(--mute);line-height:1.4}

/* карточки пар */
.list{margin-top:17px}
.row{display:grid;grid-template-columns:59px minmax(0,1fr);align-items:start}
.t b{display:block;font-size:16px;font-weight:700;line-height:1.1;margin-top:8px}
.t span{display:block;font-size:13px;color:var(--mute);margin-top:6px}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row.now .c{border-color:#3b6ea3}
.cb{padding:17px 17px 15px}
.c h3{margin:0;font-size:17px;font-weight:700;line-height:1.25}
.c h3 em{font-style:normal;font-size:12.5px;font-weight:700;color:#e9a24a;margin-left:6px;white-space:nowrap;vertical-align:1px}
.tag{display:inline-flex;align-items:center;height:22px;margin-top:10px;padding:0 9px;border-radius:7px;font-size:12.5px;font-weight:600}
.lec{background:#1f3452;color:#78b2ef}.pr{background:#1d3b2d;color:#5fd194}.ou{background:#3b2f22;color:#eda24c}
.gtag{display:flex;width:max-content;height:22px;align-items:center;margin-top:8px;padding:0 9px;border-radius:7px;font-size:12.5px;font-weight:600;background:#1d3b2d;color:#5fd194}
.who{display:block;border:0;background:none;padding:0;margin:11px 0 0;text-align:left;width:100%;font-size:14.5px;color:var(--mute);line-height:1.3}
.who u{display:block;text-decoration:none;color:var(--blue);font-size:13.5px;font-weight:600;margin-top:4px}
.loc{display:inline-flex;align-items:center;gap:8px;height:36px;margin-top:14px;padding:0 13px;border:0;border-radius:17px;background:var(--pill);color:#62a6ec;font-size:14px;font-weight:600;font-family:inherit;max-width:100%}
.loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc i{font-style:normal;color:#5d7aa0;display:flex;margin-left:1px}
.hw{margin:14px 0 0;padding:10px 12px;border-radius:12px;background:#17202e;border:1px solid #222c3b;font-size:14px;color:var(--soft);white-space:pre-wrap;line-height:1.4;word-break:break-word}
.hw small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#7e8ca0;margin-bottom:4px}
.hwimg{display:block;margin-top:8px;max-width:100%;max-height:180px;border-radius:10px;border:0;padding:0;background:none}
.hwimg img{display:block;max-width:100%;max-height:180px;border-radius:10px}
.add{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:48px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--blue);font-size:14.5px;font-weight:600}
.add svg{flex:none}
.brk{display:flex;align-items:center;gap:14px;margin:16px 0;font-size:13px;color:var(--mute);white-space:nowrap}
.brk::before,.brk::after{content:"";flex:1;height:1px;background:#283346}
.gap{height:12px}
.empty{margin-top:48px;text-align:center;color:var(--mute);font-size:15px}
.empty svg{display:block;margin:0 auto 14px;color:#5f6d82}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px;font-weight:700}
.upd{margin:22px 0 0;text-align:center;font-size:12.5px;color:#6b788c}
.empty+.upd{margin-top:56px}

/* нижняя панель */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:center;transition:transform .28s cubic-bezier(.2,.7,.2,1)}
.bar>div{width:100%;max-width:430px;background:var(--bar);border:1px solid #1e2734;border-bottom:0;border-radius:26px 26px 0 0;padding:16px 14px calc(14px + env(safe-area-inset-bottom))}
.bar.min{transform:translateY(calc(100% - 26px))}
.handle{width:37px;height:4px;border-radius:2px;background:#3a4658;margin:-8px auto 12px}
.bar .handle{cursor:pointer}
.bnav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.main.off{background:#1c2533;color:#8d9bb0}
.msub{margin:8px 0 2px;color:var(--mute);font-size:14.5px}
.wb .subj{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.wb .subj p{margin:0 0 4px}.wb .subj i{font-style:normal;color:var(--mute)}
.mh{margin:22px 0 0;font-size:13px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.main{width:100%;height:47px;border-radius:24px;border:0;background:#4f97dd;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16.5px;font-weight:700}

/* листы */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet.open{opacity:1;pointer-events:auto}
.panel{position:relative;background:#18212f;width:100%;max-width:430px;border-radius:26px 26px 0 0;border:1px solid #232e40;border-bottom:0;padding:14px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;transform:translateY(40px);transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.sheet.open .panel{transform:none}
.panel>.handle{margin:-2px auto 14px}
.x{position:absolute;right:14px;top:16px;width:38px;height:38px;border-radius:50%;border:1px solid #2c3a50;background:#1d2738;display:grid;place-items:center;color:var(--soft);padding:0}
.panel h2{margin:4px 48px 0 0;font-size:19px;font-weight:800;letter-spacing:-.2px;line-height:1.2}
.panel h2 em{font-style:normal;font-size:12.5px;font-weight:700;color:#e9a24a;margin-left:8px;vertical-align:2px}
.ssub{margin:7px 0 0;font-size:13.5px;color:var(--mute)}
.ssub b{color:var(--ink);font-weight:700}
.slbl{margin:18px 0 8px;font-size:12.5px;font-weight:700;color:#7e8ca0}
.sin{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:17px;line-height:1.3;padding:0 14px}
.sin::placeholder,.sta::placeholder{color:#6b788c}
.plist{margin-top:6px}
.plist button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:52px;border:0;border-bottom:1px solid #263244;background:none;text-align:left;padding:8px 4px;font-size:15.5px;font-weight:700}
.plist button:last-child{border-bottom:0}
.plist button span{font-size:12.5px;font-weight:500;color:var(--mute);text-align:right}
.chosen{flex:none;font-size:12px!important;font-weight:700!important;color:#6eacea!important;background:#22324a;padding:4px 10px;border-radius:10px}
.pnone{padding:22px 4px;color:var(--mute);font-size:14.5px;text-align:center}
.sta{width:100%;min-height:118px;resize:vertical;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:17px;line-height:1.45;padding:12px 14px}
.sta:focus{border-color:#5a9fe2;outline:0;box-shadow:0 0 0 1px #5a9fe2}
.attach{display:inline-flex;align-items:center;gap:10px;height:46px;margin-top:14px;padding:0 18px;border-radius:14px;border:1px dashed #3a4a62;background:transparent;color:var(--blue);font-size:15px;font-weight:700}
.thumb{position:relative;display:inline-block;margin-top:14px}
.thumb img{display:block;max-height:120px;max-width:100%;border-radius:12px}
.thumb button{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0}
.big{display:block;width:100%;height:52px;margin-top:18px;border:0;border-radius:14px;background:#4f97dd;color:#fff;font-size:16px;font-weight:700}
.big:disabled{opacity:.45;cursor:default}
.del{display:block;margin:12px auto 0;border:0;background:none;color:#e06c6c;font-weight:700;font-size:14.5px;padding:6px 12px}
.wb{padding:14px 15px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-top:14px}
.wb b{display:block;font-size:16px}
.wb span{display:block;margin-top:3px;font-size:13.5px;color:var(--mute)}
.wr{margin:10px 0 0;font-size:15px;font-weight:700;color:#62a6ec}
.wr i{display:block;font-style:normal;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--mute);margin-bottom:3px}
.routes{display:flex;gap:8px;margin-top:12px}
.routes a{flex:1;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--pill);color:#62a6ec;font-weight:700;font-size:14px;text-decoration:none}
.cust{display:flex;gap:8px}
input,textarea,select{font-size:17px}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
.cust input{flex:1}
.cust button{height:48px;padding:0 16px;border-radius:14px;border:0;background:#4f97dd;color:#fff;font-weight:700;font-size:15px}
.viewer{position:fixed;inset:0;z-index:12;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:16px}
.viewer.open{display:flex}
.viewer img{max-width:100%;max-height:100%;border-radius:10px}
.toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-30px);opacity:0;z-index:20;background:#25344a;border:1px solid #33435c;color:var(--ink);font-size:14px;font-weight:700;padding:11px 18px;border-radius:14px;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="app">
  <div class="tabs" role="tablist"><button id="tabG" class="on" role="tab" aria-selected="true">Группы</button><button id="tabT" role="tab" aria-selected="false">Преподаватели</button></div>
  <button class="grp" id="grpBtn" aria-haspopup="dialog"><span id="grpIco"></span><div><small id="grpLbl">Группа</small><b id="grpName"></b></div><i><svg width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 6 6-6 6"/></svg></i></button>
  <div class="week">
    <button class="nav" id="prev" aria-label="Предыдущая неделя"><svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2 2 8l6 6"/></svg></button>
    <div class="wk"><b id="wkRange"></b><span id="wkNum"></span></div>
    <button class="nav" id="next" aria-label="Следующая неделя"><svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 6 6-6 6"/></svg></button>
  </div>
  <div class="days" id="days"></div>
  <p class="dh" id="dh"></p><p class="dc" id="dc"></p>
  <div id="status"></div>
  <div class="list" id="list"></div>
</div>
<div class="app" id="mapView" hidden>
  <div class="tabs"><button class="on" tabindex="-1">Карта</button></div>
  <p class="msub" id="mapSub"></p>
  <div id="mapList"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="bar" id="bar"><div><div class="handle" id="barHandle"></div>
  <div class="bnav"><button class="main" id="today"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 10h18M8 2.5v4M16 2.5v4"/></svg>Расписание</button><button class="main off" id="mapBtn"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>Карта</button></div>
</div></div>

<div class="sheet" id="pick" role="dialog" aria-modal="true" aria-labelledby="pkTitle"><div class="panel">
  <div class="handle"></div><button class="x" data-close aria-label="Закрыть"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg></button>
  <h2 id="pkTitle">Выбор группы</h2><p class="ssub">Выбор запомнится на этом устройстве</p>
  <p class="slbl" id="pkLbl">Поиск группы</p><input class="sin" id="pkQ" autocomplete="off" enterkeyhint="search">
  <div class="plist" id="pkList"></div>
</div></div>

<div class="sheet" id="hwSheet" role="dialog" aria-modal="true" aria-labelledby="hwTitle"><div class="panel">
  <div class="handle"></div><button class="x" data-close aria-label="Закрыть"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg></button>
  <h2 id="hwTitle"></h2><p class="ssub" id="hwSub"></p>
  <p class="slbl">Задание</p><textarea class="sta" id="hwText" placeholder="Что задали: параграфы, задачи, сроки..."></textarea>
  <div id="hwPhoto"></div>
  <input type="file" id="hwFile" accept="image/*" class="sr" tabindex="-1">
  <button class="big" id="hwSave">Добавить</button><button class="del" id="hwDel" hidden>Удалить задание</button>
</div></div>

<div class="sheet" id="tSheet" role="dialog" aria-modal="true" aria-labelledby="tTitle"><div class="panel">
  <div class="handle"></div><button class="x" data-close aria-label="Закрыть"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg></button>
  <h2 id="tTitle"></h2><p class="ssub" id="tSub"></p>
  <p class="slbl">Поиск преподавателя</p><input class="sin" id="tQ" placeholder="Поиск: фамилия, имя или отчество" autocomplete="off" enterkeyhint="search">
  <div class="plist" id="tList"></div>
  <p class="slbl">Нет в списке?</p><div class="cust"><input class="sin" id="tCustom" placeholder="Фамилия Имя Отчество" autocomplete="off"><button id="tSave">Готово</button></div>
  <button class="del" id="tClear" hidden>Убрать преподавателя</button>
</div></div>

<div class="sheet" id="wSheet" role="dialog" aria-modal="true" aria-labelledby="wTitle"><div class="panel">
  <div class="handle"></div><button class="x" data-close aria-label="Закрыть"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg></button>
  <h2 id="wTitle"></h2><p class="ssub" id="wSub"></p>
  <div id="wBody"></div>
  <div id="wOwn"><p class="slbl">Аудитория вашей группы</p><div class="cust"><input class="sin" id="wIn" placeholder="Например, 441" autocomplete="off" inputmode="text"><button id="wSave">Сохранить</button></div><button class="del" id="wClr" hidden>Сбросить аудиторию</button></div>
</div></div>

<div class="viewer" id="viewer"><img id="viewerImg" alt="Фото к заданию"></div>
<script>
{
const S={
 'А':['Анатомия','Кафедра анатомии человека','ЛК'],
 'Б':['Биология','Кафедра медицинской генетики и биологии','ЛК'],
 'Х':['Химия','Кафедра медицинской химии','ЛК'],
 'ИР':['История России','Кафедра социально-исторических наук','УК №6'],
 'Я':['Иностранный язык','Кафедра лингвистики и межкультурной коммуникации','УК №5'],
 'Ял':['Латинский язык','Кафедра лингвистики и межкультурной коммуникации','УК №5'],
 'БЖ':['Безопасность жизнедеятельности','Кафедра нормальной физиологии и основ БЖ','УК №6'],
 'Инф':['Медицинская информатика','Кафедра математики','ЛК'],
 'Фк':['Физическая культура и спорт','Кафедра физического воспитания',''],
 'Пс':['Психология межличностной коммуникации','Психологическая безопасность',''],
 'ОУ':['Основы ухода за больными','Учебная практика · сестринское дело','']

const pl=(n,a,b,c)=>{const m=n%10,h=n%100;return n+' '+(m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c)};
const minutes=n=>pl(n,'минута','минуты','минут');
const dur=n=>{const h=Math.floor(n/60),m=n%60;return h?pl(h,'час','часа','часов')+(m?' '+m+' мин':''):m+' мин'};
const DN=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'],DS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MN=['Января','Февраля','Марта','Апреля','Мая','Июня','Июля','Августа','Сентября','Октября','Ноября','Декабря'];
const dd=d=>String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');
const monday=d=>{const x=day0(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const MINW=monday(new Date(2026,7,31)),MAXW=monday(new Date(2027,0,31));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const TL={lec:['Лекция','lec'],pr:['Практика','pr'],ou:['Учебная практика','ou']};
const parity=l=>l.w?`<em>${l.w===2?'чет':'нечет'}</em>`:'';
const shortName=n=>{const p=n.trim().split(/\s+/);return p[0]+(p[1]?' '+p[1][0]+'.':'')+(p[2]?p[2][0]+'.':'')};

function teacherLessons(d){const out=[];
 for(let g=1;g<=22;g++)for(const l of lessons(g,d)){if(store.tc[pkey(g,l)]!==teacher)continue;
  const sr=l.type==='lec'?(g<=12?'I':'II'):null;if(sr&&out.some(x=>x.t[0]===l.t[0]&&x.s===l.s))continue;out.push({...l,g,sr})}
 const m=new Map();for(const l of out){const k=l.t[0]+l.s+l.type;if(m.has(k)&&!l.sr)m.get(k).gs.push(l.g);else if(!m.has(k))m.set(k,{...l,gs:[l.g]})}
 return [...m.values()].sort((a,b)=>a.t[0].localeCompare(b.t[0]))}
const dayLessons=d=>mode==='t'?(teacher?teacherLessons(d):[]):lessons(group,d);

 if(l.type==='lec')return own?own+' (ЛК)':l.room.replace(/ ЛК$/,' (ЛК)');

function render(){
 const tm=mode==='t',today=day0(new Date());
 $('tabG').classList.toggle('on',!tm);$('tabT').classList.toggle('on',tm);
 $('tabG').setAttribute('aria-selected',!tm);$('tabT').setAttribute('aria-selected',tm);
 $('grpLbl').textContent=tm?'Преподаватель':'Группа';
 $('grpName').textContent=tm?(teacher?shortName(teacher):'Выберите преподавателя'):'Группа '+group;
 $('grpIco').innerHTML=tm?I.person:I.group;
 const m=monday(sel),n=weekNo(m);
 $('wkRange').textContent=dd(m)+' - '+dd(addD(m,6));
 $('wkNum').textContent=n>=1?n+', '+(n%2?'нечет':'чет'):'';
 $('prev').disabled=m<=MINW;$('next').disabled=m>=MAXW;
 $('days').innerHTML=R(0,6).map(i=>{const x=addD(m,i),cls=['day'];
  if(+x===+sel)cls.push('sel');if(+x===+today)cls.push('today');if(!dayLessons(x).length)cls.push('off');
  return `<button class="${cls.join(' ')}" data-i="${i}" aria-label="${DN[x.getDay()]}, ${x.getDate()} ${MN[x.getMonth()].toLowerCase()}"${+x===+sel?' aria-current="date"':''}><small>${DS[i]}</small><b>${x.getDate()}</b></button>`}).join('');
 const ls=dayLessons(sel),pr=period(sel);
 $('dh').textContent=DN[sel.getDay()]+', '+sel.getDate()+' '+MN[sel.getMonth()];
 $('dc').textContent=ls.length?pl(ls.length,'пара','пары','пар'):'';
 const now=new Date(),isT=+sel===+today,cur=now.getHours()*60+now.getMinutes();
 let stat='';
 if(isT&&ls.length){
  const on=ls.find(l=>mins(l.t[0])<=cur&&cur<mins(l.t[3])),nx=ls.find(l=>mins(l.t[0])>cur);
  if(on)stat=`<b>Идёт: ${esc(S[on.s][0])}</b><span>ещё ${dur(mins(on.t[3])-cur)} · конец в ${on.t[3]}</span>`;
  else if(nx)stat=`<b>Ближайшая пара через ${dur(mins(nx.t[0])-cur)}</b><span>${esc(S[nx.s][0])} · начало в ${nx.t[0]}</span>`;
  else stat='<b>Занятия на сегодня закончились</b>'}
 $('status').innerHTML=stat?`<div class="status">${stat}</div>`:'';
 const upd=`<p class="upd">данные обновлены ${UPD}</p>`;
 if(tm&&!teacher){$('list').innerHTML=`<div class="empty">${I.person}<b>Выберите преподавателя</b>Нажмите на карточку выше</div>`;return}
 if(tm&&!Object.values(store.tc).includes(teacher)){$('list').innerHTML=`<div class="empty">${I.person}<b>Пары не назначены</b>Отметьте преподавателя в карточке пары<br>на вкладке «Группы»</div>`;return}
 if(!ls.length){const why=pr[0]==='off'&&sel.getDay()?pr[1]:'';$('list').innerHTML=`<div class="empty">${I.cal}${why?`<b>${why}</b>`:''}Занятий в этот день нет</div>`+upd;return}
 $('list').innerHTML=ls.map((l,i)=>{
  const s=S[l.s],t=TL[l.type],now=isT&&mins(l.t[0])<=cur&&cur<mins(l.t[3])?' now':'';
  let brk='';if(i){const gap=mins(l.t[0])-mins(ls[i-1].t[3]);brk=gap>0?`<div class="brk">Перемена ${minutes(gap)}</div>`:'<div class="gap"></div>'}
  const head=`${brk}<div class="row${now}"><div class="t"><b>${l.t[0]}</b><span>${l.t[3]}</span></div><div class="c"><div class="cb"><h3>${esc(s[0])}${parity(l)}</h3><span class="tag ${t[1]}">${t[0]}</span>`;
  if(tm){const gt=l.sr?'поток '+l.sr:'гр. '+l.gs.join(', ');
   return head+`<span class="gtag">${gt}</span><span class="loc">${I.pin}<span>${esc(locText(l,store.rm[pkey(l.gs[0],l)]))}</span></span></div></div></div>`}
  const pk=pkey(group,l),own=store.rm[pk],tn=store.tc[pk],hk=hkey(l),hw=store.hw[hk],ph=store.hwp[hk];
  const who=tn?`<button class="who" data-a="teach" data-i="${i}">${esc(tn)}</button>`:`<button class="who" data-a="teach" data-i="${i}">${esc(s[1])}<u>Указать преподавателя</u></button>`;
  const hwb=hw||ph?`<div class="hw"><small>Домашнее задание</small>${hw?esc(hw):''}${ph?`<button class="hwimg" data-a="photo" data-i="${i}" aria-label="Открыть фото"><img src="${ph}" alt=""></button>`:''}</div>`:'';
  return head+who+`<button class="loc" data-a="loc" data-i="${i}">${I.pin}<span>${esc(locText(l,own))}</span><i>${I.chev}</i></button>${hwb}</div><button class="add" data-a="hw" data-i="${i}">${I.plus}${hw||ph?'Изменить домашнее задание':'Добавить домашнее задание'}</button></div></div>`}).join('')+upd;
}

async function loadPhoto(f){
 const draw=src=>{const w=src.naturalWidth||src.width,h=src.naturalHeight||src.height;if(!w||!h)throw 0;const k=Math.min(1,1280/Math.max(w,h)),c=document.createElement('canvas');
  c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.72);if(d.length<100)throw 0;return d};
 const viaImg=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{try{ok(draw(i))}catch(e){no(e)}};i.onerror=no;i.src=src});
 try{if(window.createImageBitmap){const bm=await createImageBitmap(f);try{return draw(bm)}finally{bm.close&&bm.close()}}}catch(e){}
 const u=URL.createObjectURL(f);try{return await viaImg(u)}catch(e){}finally{URL.revokeObjectURL(u)}
 const dataUrl=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
 return viaImg(dataUrl)}
$('hwFile').onchange=async()=>{const inp=$('hwFile'),f=inp.files&&inp.files[0];if(!f)return;
 $('hwPhoto').innerHTML='<div class="attach">Загрузка фото…</div>';
 try{hwPhoto=await loadPhoto(f)}catch(e){toast(/hei[cf]/i.test(f.type+f.name)?'Формат HEIC не поддерживается — выберите JPEG':'Не удалось открыть фото')}
 inp.value='';hwPhotoUI()};

let view='s';
function showView(v){view=v;const m=v==='m';document.querySelector('.app').hidden=m;$('mapView').hidden=!m;
 $('today').classList.toggle('off',m);$('mapBtn').classList.toggle('off',!m);if(m)renderMap();scrollTo({top:0});$('bar').classList.remove('min')}
function renderMap(){const tm=store.mode==='t',use={};
 if(!tm){for(let d=new Date(MINW);d<=new Date(+MAXW+6*864e5);d=new Date(+d+864e5))for(const l of lessons(group,d)){
  if(l.type==='lec'){(use.ЛК=use.ЛК||{})['lec|'+l.s]=[S[l.s][0]+' — лекции',l.room.replace(/ ЛК$/,'')]}
  else for(const v of LF[l.s]||[]){(use[v.b]=use[v.b]||{})[l.s]=[S[l.s][0],'а. '+fmtR(v.rooms)]}}}
 const card=(k,u)=>`<div class="wb"><b>${B[k][0]}</b><span>${B[k][1]}</span>${u?`<div class="subj">${Object.values(u).sort((a,b)=>a[0].localeCompare(b[0],'ru')).map(x=>`<p>${esc(x[0])} <i>· ${esc(x[1])}</i></p>`).join('')}</div>`:''}<div class="routes"><a href="${ymap(B[k][1])}" target="_blank" rel="noopener">Яндекс Карты</a><a href="${gmap(B[k][1])}" target="_blank" rel="noopener">2ГИС</a></div></div>`;
 const ks=Object.keys(B),mine=ks.filter(k=>use[k]),rest=ks.filter(k=>!use[k]);
 $('mapSub').textContent=tm?'Корпуса и клиники, где проходят занятия':'Где учится группа '+group+' в этом семестре';
 $('mapList').innerHTML=mine.map(k=>card(k,use[k])).join('')+(rest.length?(mine.length?'<p class="mh">Другие корпуса</p>':'')+rest.map(k=>card(k)).join(''):'')}
$('today').onclick=()=>{if(view!=='s'){showView('s');return}sel=day0(new Date());render();scrollTo({top:0,behavior:'smooth'});$('bar').classList.remove('min')};
$('mapBtn').onclick=()=>{if(view!=='m')showView('m')};
let lastY=scrollY;
addEventListener('scroll',()=>{const y=scrollY,d=y-lastY;if(y<40||d<-6)$('bar').classList.remove('min');else if(d>6)$('bar').classList.add('min');lastY=y},{passive:true});
$('barHandle').onclick=()=>$('bar').classList.toggle('min');

// обновление статуса раз в минуту и при возврате в приложение
setInterval(()=>{if(!openSh)render()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!openSh)render()});
render();
if(!store.g)openPicker();
}
</script>
</body>
</html>
