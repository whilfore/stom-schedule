<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#151c27">
<title>Расписание</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#151c27;--card:#1d2738;--line:#2a3548;--ink:#f3f6fa;--mute:#8693a7;--soft:#c9d2de;--acc:#4f9de6;--blue:#5aa3ec;--pill:#263349;--bar:#0f141d}
*{box-sizing:border-box;min-width:0}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.3 -apple-system,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{max-width:430px;margin:0 auto;padding:20px 16px 130px}

/* шапка */
.tabs{display:flex;gap:16px;font-size:25px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
.tabs button{border:0;background:none;padding:0;font:inherit;color:#3d4b60;letter-spacing:inherit;transition:color .2s}
.tabs button.on{color:var(--ink)}
.grp{margin-top:18px;display:flex;align-items:center;gap:12px;width:100%;height:55px;padding:0 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left}
.grp svg{flex:none;color:var(--acc)}
.grp i svg{color:#6b788c}
.grp small{display:block;font-size:12px;color:var(--mute);line-height:1.15}
.grp b{display:block;font-size:16.5px;font-weight:700;line-height:1.2}
.grp i{margin-left:auto;color:var(--mute);font-style:normal;display:flex}

/* неделя и дни */
.week{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.nav{width:43px;height:43px;border-radius:50%;border:1px solid #2c3a50;background:transparent;display:grid;place-items:center;flex:none;padding:0;color:var(--ink)}
.nav:disabled{border-color:transparent;background:#18202c;color:#4a576a;cursor:default}
.wk{font-size:15px;font-weight:700;white-space:nowrap}
.wk span{font-size:12px;font-weight:600;color:var(--mute);margin-left:6px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px}
.day{height:61px;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
.day small{font-size:13px;color:var(--mute)}
.day b{font-size:19px;font-weight:700;color:var(--soft);line-height:1}
.day.off b{color:#5f6d82}
.day.today small,.day.today b{color:var(--blue)}
.day.today b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.day.sel{background:#263449}
.day.sel.today{background:#5a9fe2}.day.sel.today small{color:#dbeafb}.day.sel.today b{color:#fff}
.dh{margin:19px 0 0;font-size:15px;font-weight:700;color:#8e9ab0}
.dc{margin:5px 0 0;font-size:14px;color:var(--mute)}
.dc:empty{display:none}

/* статус */
.status{margin-top:14px;background:var(--card);border:1px solid #2c4364;border-radius:18px;padding:15px 15px 14px}
.status b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.status span{display:block;margin-top:5px;font-size:13.5px;color:var(--mute);line-height:1.4}

/* карточки пар */
.list{margin-top:17px}
.row{display:grid;grid-template-columns:59px minmax(0,1fr);align-items:start}
.t b{display:block;font-size:16px;font-weight:700;line-height:1.1;margin-top:8px}
.t span{display:block;font-size:13px;color:var(--mute);margin-top:6px}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row.now .c{border-color:#3b6ea3}
.cb{padding:17px 17px 15px}
.c h3{margin:0;font-size:17px;font-weight:700;line-height:1.25}
.c h3 em{font-style:normal;font-size:12.5px;font-weight:700;color:#e9a24a;margin-left:6px;white-space:nowrap;vertical-align:1px}
.tag{display:inline-flex;align-items:center;height:22px;margin-top:10px;padding:0 9px;border-radius:7px;font-size:12.5px;font-weight:600}
.lec{background:#1f3452;color:#78b2ef}.pr{background:#1d3b2d;color:#5fd194}.ou{background:#3b2f22;color:#eda24c}
.gtag{display:flex;width:max-content;height:22px;align-items:center;margin-top:8px;padding:0 9px;border-radius:7px;font-size:12.5px;font-weight:600;background:#1d3b2d;color:#5fd194}
.who{display:block;border:0;background:none;padding:0;margin:11px 0 0;text-align:left;width:100%;font-size:14.5px;color:var(--mute);line-height:1.3}
.who u{display:block;text-decoration:none;color:var(--blue);font-size:13.5px;font-weight:600;margin-top:4px}
.loc{display:inline-flex;align-items:center;gap:8px;height:36px;margin-top:14px;padding:0 13px;border:0;border-radius:17px;background:var(--pill);color:#62a6ec;font-size:14px;font-weight:600;font-family:inherit;max-width:100%}
.loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc i{font-style:normal;color:#5d7aa0;display:flex;margin-left:1px}
.hw{margin:14px 0 0;padding:10px 12px;border-radius:12px;background:#17202e;border:1px solid #222c3b;font-size:14px;color:var(--soft);white-space:pre-wrap;line-height:1.4;word-break:break-word}
.hw small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#7e8ca0;margin-bottom:4px}
.hwimg{display:block;margin-top:8px;max-width:100%;max-height:180px;border-radius:10px;border:0;padding:0;background:none}
.hwimg img{display:block;max-width:100%;max-height:180px;border-radius:10px}
.add{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:48px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--blue);font-size:14.5px;font-weight:600}
.add svg{flex:none}
.brk{display:flex;align-items:center;gap:14px;margin:16px 0;font-size:13px;color:var(--mute);white-space:nowrap}
.brk::before,.brk::after{content:"";flex:1;height:1px;background:#283346}
.gap{height:12px}
.empty{margin-top:48px;text-align:center;color:var(--mute);font-size:15px}
.empty svg{display:block;margin:0 auto 14px;color:#5f6d82}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px;font-weight:700}
.upd{margin:22px 0 0;text-align:center;font-size:12.5px;color:#6b788c}
.empty+.upd{margin-top:56px}

/* нижняя панель */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:center;transition:transform .28s cubic-bezier(.2,.7,.2,1)}
.bar>div{width:100%;max-width:430px;background:var(--bar);border:1px solid #1e2734;border-bottom:0;border-radius:26px 26px 0 0;padding:16px 14px calc(14px + env(safe-area-inset-bottom))}
.bar.min{transform:translateY(calc(100% - 26px))}
.handle{width:37px;height:4px;border-radius:2px;background:#3a4658;margin:-8px auto 12px}
.bar .handle{cursor:pointer}
.bnav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.main.off{background:#1c2533;color:#8d9bb0}
.msub{margin:8px 0 2px;color:var(--mute);font-size:14.5px}
.wb .subj{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.wb .subj p{margin:0 0 4px}.wb .subj i{font-style:normal;color:var(--mute)}
.mh{margin:22px 0 0;font-size:13px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.main{width:100%;height:47px;border-radius:24px;border:0;background:#4f97dd;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16.5px;font-weight:700}

/* листы */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet.open{opacity:1;pointer-events:auto}
.panel{position:relative;background:#18212f;width:100%;max-width:430px;border-radius:26px 26px 0 0;border:1px solid #232e40;border-bottom:0;padding:14px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;transform:translateY(40px);transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.sheet.open .panel{transform:none}
.panel>.handle{margin:-2px auto 14px}
.x{position:absolute;right:14px;top:16px;width:38px;height:38px;border-radius:50%;border:1px solid #2c3a50;background:#1d2738;display:grid;place-items:center;color:var(--soft);padding:0}
.panel h2{margin:4px 48px 0 0;font-size:19px;font-weight:800;letter-spacing:-.2px;line-height:1.2}
.panel h2 em{font-style:normal;font-size:12.5px;font-weight:700;color:#e9a24a;margin-left:8px;vertical-align:2px}
.ssub{margin:7px 0 0;font-size:13.5px;color:var(--mute)}
.ssub b{color:var(--ink);font-weight:700}
.slbl{margin:18px 0 8px;font-size:12.5px;font-weight:700;color:#7e8ca0}
.sin{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:17px;line-height:1.3;padding:0 14px}
.sin::placeholder,.sta::placeholder{color:#6b788c}
.plist{margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -18px 0;padding:0 18px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
#pkProg .slbl+.chips{margin-top:0}
.chip{flex:none;border:0;border-radius:18px;background:#1f2a3a;color:#c9d3e0;font-size:14px;font-weight:600;padding:9px 14px;white-space:nowrap}
.chip.on{background:#5a9fe2;color:#fff}
.chip.dev{color:#5f6d82;background:#192230}
.devbox{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--mute);font-size:14px;padding:30px 10px 18px}
.devbox svg{color:#5f6d82}.devbox b{color:var(--ink);font-size:16px}
.plist button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:52px;border:0;border-bottom:1px solid #263244;background:none;text-align:left;padding:8px 4px;font-size:15.5px;font-weight:700}
.plist button:last-child{border-bottom:0}
.plist button span{font-size:12.5px;font-weight:500;color:var(--mute);text-align:right}
.chosen{flex:none;font-size:12px!important;font-weight:700!important;color:#6eacea!important;background:#22324a;padding:4px 10px;border-radius:10px}
.pnone{padding:22px 4px;color:var(--mute);font-size:14.5px;text-align:center}
.sta{width:100%;min-height:118px;resize:vertical;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:17px;line-height:1.45;padding:12px 14px}
.sta:focus{border-color:#5a9fe2;outline:0;box-shadow:0 0 0 1px #5a9fe2}
.attach{display:inline-flex;align-items:center;gap:10px;height:46px;margin-top:14px;padding:0 18px;border-radius:14px;border:1px dashed #3a4a62;background:transparent;color:var(--blue);font-size:15px;font-weight:700}
.thumb{position:relative;display:inline-block;margin-top:14px}
.thumb img{display:block;max-height:120px;max-width:100%;border-radius:12px}
.thumb button{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0}
.big{display:block;width:100%;height:52px;margin-top:18px;border:0;border-radius:14px;background:#4f97dd;color:#fff;font-size:16px;font-weight:700}
.big:disabled{opacity:.45;cursor:default}
.del{display:block;margin:12px auto 0;border:0;background:none;color:#e06c6c;font-weight:700;font-size:14.5px;padding:6px 12px}
.wb{padding:14px 15px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-top:14px}
.wb b{display:block;font-size:16px}
.wb span{display:block;margin-top:3px;font-size:13.5px;color:var(--mute)}
.wr{margin:10px 0 0;font-size:15px;font-weight:700;color:#62a6ec}
.wr i{display:block;font-style:normal;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--mute);margin-bottom:3px}
.routes{display:flex;gap:8px;margin-top:12px}
.routes a{flex:1;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--pill);color:#62a6ec;font-weight:700;font-size:14px;text-decoration:none}
.cust{display:flex;gap:8px}
input,textarea,select{font-size:17px}
html,body{-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
*{touch-action:pan-x pan-y}
.cust input{flex:1}
.cust button{height:48px;padding:0 16px;border-radius:14px;border:0;background:#4f97dd;color:#fff;font-weight:700;font-size:15px}
.viewer{position:fixed;inset:0;z-index:12;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:16px}
.viewer.open{display:flex}
.viewer img{max-width:100%;max-height:100%;border-radius:10px}
.toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-30px);opacity:0;z-index:20;background:#25344a;border:1px solid #33435c;color:var(--ink);font-size:14px;font-weight:700;padding:11px 18px;border-radius:14px;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.blist{display:flex;flex-direction:column;gap:8px}
<script src="https://telegram.org/js/telegram-web-app.js"></script>
.bopt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:58px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-align:left}
.bopt b{display:block;font-size:15.5px}
.bopt small{display:block;margin-top:2px;font-size:12.5px;color:var(--mute);line-height:1.35}
.bopt em{flex:none;font-style:normal;font-size:11.5px;font-weight:700;color:#7e8ca0;background:#1f2a3a;padding:4px 8px;border-radius:9px}
.bopt.on{border-color:#5a9fe2;background:#1d2d44}
.bopt.on em{color:#cfe3f8;background:#2b4466}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.ropt{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14.5px;font-weight:700;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ropt.on{background:#5a9fe2;border-color:#5a9fe2;color:#fff}
.ropt.add{color:#62a6ec;border-style:dashed}
#wAddBox{margin-top:10px}
.wsrc{margin:16px 2px 0;font-size:12px;line-height:1.45;color:#6b788c}
.whint{margin:14px 2px 0;color:var(--mute);font-size:14px;text-align:center}
/* ===== оформление 2: стекло, свечение, медицинские иллюстрации ===== */
:root{--ecg:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 22%22 preserveAspectRatio=%22none%22%3E%3Cpath d=%22M0 11H150l4-3 4 6 5-13 5 19 4-11 3 2H200%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%221.6%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E");--cal:url("data:image/svg+xml,%3Csvg viewBox=%220 0 256 256%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cpath fill=%22%23000%22 d=%22M208 32h-24v-8a8 8 0 0 0-16 0v8H88v-8a8 8 0 0 0-16 0v8H48a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16M72 48v8a8 8 0 0 0 16 0v-8h80v8a8 8 0 0 0 16 0v-8h24v32H48V48Zm136 160H48V96h160z%22/%3E%3C/svg%3E");--bg:#0a0f17;--card:rgba(30,41,58,.52);--line:rgba(150,180,220,.13);--ink:#eef3fa;--mute:#8b98ad;--soft:#cdd6e3;--acc:#6aa9ff;--blue:#7cb4ff;--pill:rgba(70,100,140,.22);--bar:rgba(16,22,32,.72);--glass:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.02));--glow:0 0 0 1px rgba(120,170,255,.55),0 0 18px rgba(90,150,255,.35),inset 0 0 14px rgba(120,170,255,.18)}
html,body{background:var(--bg)}
body{background:radial-gradient(120% 60% at 50% -10%,#18253a 0%,rgba(10,15,23,0) 60%),radial-gradient(80% 50% at 100% 40%,rgba(40,70,120,.18),transparent 70%),radial-gradient(70% 40% at 0% 75%,rgba(40,80,110,.14),transparent 70%),var(--bg);background-attachment:fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;background-image:linear-gradient(rgba(120,160,220,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,220,.05) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:linear-gradient(180deg,#000 0,transparent 55%);mask-image:linear-gradient(180deg,#000 0,transparent 55%)}
.app{position:relative;z-index:1;padding-top:0}
.art{display:block;background:linear-gradient(160deg,#cfe1ff 0%,#6f93c8 55%,#2c4266 100%);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}

/* шапка-заставка */
.hero{position:relative;height:150px;margin:0 -16px 6px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:18px;text-align:center}
.hero .art{position:absolute;filter:drop-shadow(0 0 10px rgba(110,160,240,.35))}
.hero .h1{left:-26px;top:-14px;width:170px;height:170px;opacity:.38;transform:rotate(-18deg)}
.hero .h2{right:-18px;top:-6px;width:140px;height:150px;opacity:.32;transform:rotate(14deg)}
.hero .h3{left:46%;top:8px;width:46px;height:46px;opacity:.12}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,15,23,0) 35%,rgba(10,15,23,.55) 100%);pointer-events:none}
.hero h1{position:relative;z-index:1;margin:0;font-size:29px;font-weight:800;letter-spacing:-.6px;line-height:1.1;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.hero p{position:relative;z-index:1;margin:5px 0 0;font-size:15px;font-weight:500;color:#a7b3c6;letter-spacing:.2px}

/* стеклянная поверхность */
.grp,.row,.nav,.day,.status,.add,.wb,.bopt,.ropt,.sin,.sta,.panel,.bar>div,.main,.tabs button,.empty-card{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

/* вкладки */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:16px;font-weight:700;letter-spacing:0}
.tabs button{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:27px;border:1px solid var(--line);background:var(--glass),rgba(24,33,48,.6);color:#aeb9ca;font-size:16px;font-weight:700;transition:box-shadow .25s,color .25s,background .25s}
.tabs button svg{width:21px;height:21px;flex:none}
.tabs button{white-space:nowrap;padding:0 10px}
.tabs button.on{color:#fff;background:linear-gradient(180deg,rgba(110,160,240,.28),rgba(60,100,170,.18)),rgba(24,33,48,.7);border-color:transparent;box-shadow:var(--glow)}
#mapView .tabs{display:block}
#mapView .tabs button{display:none}

/* группа */
.grp{height:66px;margin-top:14px;border-radius:22px;padding:0 18px;background:var(--glass),var(--card);border:1px solid var(--line);gap:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.grp>span svg{width:30px;height:30px;color:#7cb4ff;filter:drop-shadow(0 0 8px rgba(110,170,255,.45))}
.grp small{font-size:13px;color:#9aa6b8}
.grp b{font-size:18px;font-weight:800;margin-top:2px}

/* неделя */
.week{margin-top:16px}
.nav{width:46px;height:46px;border:1px solid var(--line);background:var(--glass),rgba(22,30,44,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.nav:disabled{background:rgba(20,26,36,.5);border-color:rgba(150,180,220,.06)}
.wk{font-size:17px;font-weight:800}
.wk span{font-size:13px;color:#9aa6b8}
.days{gap:6px;margin-top:16px}
.day{position:relative;height:66px;border-radius:15px;border:1px solid var(--line);background:var(--glass),rgba(22,30,44,.55);gap:5px;transition:box-shadow .2s,background .2s}
.day small{font-size:13px;color:#a2adbf}
.day b{font-size:19px;font-weight:800;color:#f1f5fb}
.day.off b{color:#7c899c}.day.off small{color:#6f7b8e}
.day.today small,.day.today b{color:inherit}
.day.today b{text-decoration:none}
.day.today::after{content:"";position:absolute;bottom:7px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(160,200,255,.9)}
.day.sel,.day.sel.today{background:linear-gradient(180deg,rgba(120,170,250,.3),rgba(60,100,170,.16)),rgba(24,33,48,.7);border-color:transparent;box-shadow:var(--glow)}
.day.sel small,.day.sel.today small{color:#dce9fb}.day.sel b,.day.sel.today b{color:#fff}

/* заголовок дня */
.dh{display:flex;align-items:center;gap:10px;margin-top:22px;font-size:17px;font-weight:800;color:#e3e9f2}
.dh::before{content:"";flex:none;width:24px;height:24px;background:linear-gradient(160deg,#9cc6ff,#5b8fe0);-webkit-mask:var(--cal) center/contain no-repeat;mask:var(--cal) center/contain no-repeat}
.dc{margin-top:6px;font-size:14.5px;color:#9aa6b8}

/* статус */
.status{border-radius:20px;background:var(--glass),var(--card);border:1px solid rgba(120,170,255,.28);box-shadow:0 0 22px rgba(80,140,240,.12)}

/* карточка пары */
.list{margin-top:16px}
.row{position:relative;display:grid;grid-template-columns:86px minmax(0,1fr);align-items:stretch;border-radius:24px;background:var(--glass),var(--card);border:1px solid var(--line);overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.28)}
.row::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(90% 120% at 100% 0%,rgba(110,150,220,.10),transparent 60%)}
.row.now{border-color:transparent;box-shadow:var(--glow),0 12px 34px rgba(0,0,0,.28)}
.t{position:relative;padding:18px 0 16px 18px}
.t::after{content:"";position:absolute;right:0;top:18px;bottom:18px;width:1px;background:linear-gradient(180deg,rgba(150,180,220,.35),rgba(150,180,220,.08))}
.t b{margin-top:0;font-size:19px;font-weight:800;letter-spacing:-.2px}
.t span{margin-top:7px;font-size:15px;color:#a2adbf}
.c{position:relative;z-index:1;background:none;border:0;border-radius:0;overflow:visible}
.cb{padding:16px 16px 16px 18px}
.c h3{font-size:19px;font-weight:800;letter-spacing:-.2px;padding-right:56px}
.row .art{position:absolute;right:-4px;bottom:62px;width:104px;height:104px;opacity:.17;pointer-events:none;filter:drop-shadow(0 0 12px rgba(120,170,255,.25))}
.tag{height:26px;margin-top:10px;padding:0 12px;border-radius:13px;font-size:13.5px;font-weight:700;border:1px solid rgba(255,255,255,.08)}
.lec{background:rgba(70,120,200,.24);color:#a9cbff}.pr{background:rgba(110,140,180,.2);color:#d7e2f1}.ou{background:rgba(200,140,60,.2);color:#f2c182}
.gtag{height:26px;border-radius:13px;padding:0 12px;font-size:13.5px;background:rgba(110,140,180,.2);color:#d7e2f1}
.who{margin-top:12px;font-size:15.5px;color:#aab5c6}
.who u{color:var(--blue);font-size:14px}
.loc{height:40px;margin-top:14px;padding:0 14px;border-radius:20px;background:rgba(18,26,38,.65);border:1px solid var(--line);color:#e6edf7;font-size:15px;font-weight:700}
.loc svg{color:#7cb4ff;width:17px;height:17px}
.loc i{color:#9aa6b8}
.hw{background:rgba(14,20,30,.6);border:1px solid var(--line);border-radius:14px}
.add{height:54px;margin-top:10px;border:1px solid var(--line);border-radius:27px;background:var(--glass),rgba(22,30,44,.55);color:#e6edf7;font-size:16px;font-weight:700;gap:12px}
.add svg{width:20px;height:20px;color:#cfe0f5}

/* перемена */
.brk{gap:12px;margin:18px 0;font-size:14.5px;color:#a2adbf}
.brk::before,.brk::after{display:none}
.brk i{flex:1;height:22px;background:linear-gradient(90deg,rgba(150,180,220,.08),rgba(150,180,220,.45));-webkit-mask:var(--ecg) center/100% 22px no-repeat;mask:var(--ecg) center/100% 22px no-repeat}
.brk i.r{transform:scaleX(-1)}
.gap{height:14px}

/* пусто */
.empty{margin-top:30px;padding:30px 18px;border-radius:24px;background:var(--glass),var(--card);border:1px solid var(--line)}
.empty svg{color:#7cb4ff}

/* нижняя панель */
.bar>div{background:linear-gradient(180deg,rgba(40,52,72,.55),rgba(16,22,32,.8));border:1px solid var(--line);border-bottom:0;border-radius:30px 30px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.45)}
.handle{background:rgba(180,200,230,.35)}
.bnav{gap:12px}
.main{height:58px;border-radius:29px;font-size:18px;font-weight:800;gap:12px;background:linear-gradient(180deg,rgba(120,170,250,.32),rgba(60,100,170,.2)),rgba(24,33,48,.75);color:#fff;box-shadow:var(--glow)}
.main svg{width:24px;height:24px}
.main.off{background:var(--glass),rgba(22,30,44,.6);color:#c3cddb;box-shadow:none;border:1px solid var(--line)}

/* карта */
#mapView .msub{margin-top:4px}
.wb{border-radius:20px;background:var(--glass),var(--card)}
.routes a{border-radius:14px;background:rgba(18,26,38,.65);border:1px solid var(--line);color:#a9cbff}

/* листы */
.sheet{background:rgba(3,6,12,.6)}
.panel{background:linear-gradient(180deg,rgba(32,44,62,.92),rgba(16,22,32,.96));border:1px solid var(--line);border-bottom:0;border-radius:30px 30px 0 0}
.x{background:var(--glass),rgba(24,33,48,.7);border:1px solid var(--line)}
.sin,.sta{background:rgba(14,20,30,.7);border:1px solid var(--line);border-radius:16px}
.big,.cust button{border-radius:18px;background:linear-gradient(180deg,#6aa9ff,#3f7fd8);box-shadow:0 6px 20px rgba(70,130,230,.35)}
.bopt{border-radius:16px;background:var(--glass),var(--card);border:1px solid var(--line)}
.bopt.on{background:linear-gradient(180deg,rgba(120,170,250,.25),rgba(60,100,170,.14)),rgba(24,33,48,.7);border-color:transparent;box-shadow:var(--glow)}
.ropt{border-radius:14px;background:var(--glass),rgba(22,30,44,.55);border:1px solid var(--line)}
.ropt.on{background:linear-gradient(180deg,#6aa9ff,#3f7fd8);border-color:transparent;box-shadow:0 0 14px rgba(90,150,255,.45)}
.chip{background:var(--glass),rgba(24,33,48,.7);border:1px solid var(--line)}
.chip.on{background:linear-gradient(180deg,#6aa9ff,#3f7fd8);border-color:transparent}
.toast{background:rgba(30,42,60,.92);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

function cloudSave(){const cs=cloudOK();if(!cs)return;const o={};CK.forEach(k=>{if(store[k]!==undefined)o[k]=store[k]});

 try{for(let i=0;i<n;i++)cs.setItem('s'+i,j.slice(i*4000,(i+1)*4000));cs.setItem('sn',String(n))}catch(e){}}

let mode=store.mode==='t'?'t':'g',teacher=store.teacher||'';

function teacherLessons(d){const out=[];
 for(let g=1;g<=PR().G;g++)for(const l of lessons(g,d)){if(store.tc[pkey(g,l)]!==teacher)continue;
  const sr=l.type==='lec'?(prog==='st1'?(g<=12?'I':'II'):stOf(g)):null;if(sr&&out.some(x=>x.t[0]===l.t[0]&&x.s===l.s))continue;out.push({...l,g,sr})}
 const m=new Map();for(const l of out){const k=l.t[0]+l.s+l.type;if(m.has(k)&&!l.sr)m.get(k).gs.push(l.g);else if(!m.has(k))m.set(k,{...l,gs:[l.g]})}
 return [...m.values()].sort((a,b)=>a.t[0].localeCompare(b.t[0]))}
const dayLessons=d=>mode==='t'?(teacher?teacherLessons(d):[]):lessons(group,d);
// адреса и аудитории: только из справки НГМУ (BL); место пары: только то, что написано в расписании или выбрал пользователь
const BA={};BL.forEach(x=>BA[x[0]]=x);
const bShort=a=>BA[a]?BA[a][2]:a.replace(/^(ул\.|пр\.)\s*/,'');
const shortA=a=>a.replace(/^(ул\.|пр\.)\s*/,'');
const roomTxt=r=>/^\d/.test(r)?'а. '+r:r;
const schedPlace=l=>(l.type==='lec'||l.type==='ev')&&l.room?l.room:'';
// выбор пользователя: {a:адрес, r:аудитория} или {x:1, t:текст «другого места»}
function locText(l,own){
 if(own){if(own.x)return own.t||'Другое место';if(own.a)return(own.r?roomTxt(own.r)+' · ':'')+bShort(own.a);if(own.r)return roomTxt(own.r)}
 return schedPlace(l)||'Выбрать корпус'}

  if(+x===+sel)cls.push('sel');if(+x===+today)cls.push('today');if(!dayLessons(x).length)cls.push('off');

 $('dc').textContent=ls.filter(l=>l.t[0]).length?pl(ls.filter(l=>l.t[0]).length,'пара','пары','пар'):'';
 const now=new Date(),isT=+sel===+today,cur=now.getHours()*60+now.getMinutes();
 let stat='';
 if(isT&&ls.some(l=>l.t[0])){
  const lt=ls.filter(l=>l.t[0]),on=lt.find(l=>mins(l.t[0])<=cur&&cur<mins(l.t[3])),nx=lt.find(l=>mins(l.t[0])>cur);
  if(on)stat=`<b>Идёт: ${esc(S[on.s][0])}</b><span>ещё ${dur(mins(on.t[3])-cur)} · конец в ${on.t[3]}</span>`;

  else stat='<b>Занятия на сегодня закончились</b>'}
 $('status').innerHTML=stat?`<div class="status">${stat}</div>`:'';
 const upd=`<p class="upd">данные обновлены ${UPD}</p>`;
 if(tm&&!teacher){$('list').innerHTML=`<div class="empty">${I.person}<b>Выберите преподавателя</b>Нажмите на карточку выше</div>`;return}
 if(tm&&!Object.values(store.tc).includes(teacher)){$('list').innerHTML=`<div class="empty">${I.person}<b>Пары не назначены</b>Отметьте преподавателя в карточке пары<br>на вкладке «Группы»</div>`;return}
 if(!ls.length){let why=pr[0]==='off'&&sel.getDay()?pr[1]:'';if(prog!=='st1'&&sel.getDay()){const k=ymd(sel);why=HOL[k]||(k>=20261231&&k<=20270108?'Новогодние праздники':k>PR().end&&k<=20270131?(PR().note||'Учебные занятия закончились'):'')}$('list').innerHTML=`<div class="empty">${I.cal}${why?`<b>${why}</b>`:''}Занятий в этот день нет</div>`+upd;return}
 $('list').innerHTML=ls.map((l,i)=>{
  const s=S[l.s],t=TL[l.type],now=isT&&l.t[0]&&mins(l.t[0])<=cur&&cur<mins(l.t[3])?' now':'';
  let brk='';if(i&&l.t[0]&&ls[i-1].t[0]){const gap=mins(l.t[0])-mins(ls[i-1].t[3]);brk=gap>0?`<div class="brk"><i></i><span>Перемена ${minutes(gap)}</span><i class="r"></i></div>`:'<div class="gap"></div>'}
  const head=`${brk}<div class="row${now}"><div class="t">${l.all?'<b>Весь</b><span>день</span>':`<b>${l.t[0]}</b><span>${l.t[3]}</span>`}</div><div class="c"><div class="cb"><h3>${esc(s[0])}${parity(l)}</h3><span class="tag ${t[1]}">${t[0]}</span>`;
  if(tm){const gt=l.sr?(l.sr==='all'?'весь курс':'поток '+l.sr):'гр. '+l.gs.join(', ');
   return head+`<span class="gtag">${gt}</span><span class="loc">${I.pin}<span>${esc(locText(l,store.loc[pkey(l.gs[0],l)]))}</span></span></div></div><span class="art ${artOf(l)}"></span></div>`}
  const pk=pkey(group,l),own=store.loc[pk],tn=store.tc[pk],hk=hkey(l),hw=store.hw[hk],ph=store.hwp[hk];
  const who=tn?`<button class="who" data-a="teach" data-i="${i}">${esc(tn)}</button>`:`<button class="who" data-a="teach" data-i="${i}">${esc(s[1])}<u>Указать преподавателя</u></button>`;
  const hwb=hw||ph?`<div class="hw"><small>Домашнее задание</small>${hw?esc(hw):''}${ph?`<button class="hwimg" data-a="photo" data-i="${i}" aria-label="Открыть фото"><img src="${ph}" alt=""></button>`:''}</div>`:'';
  return head+who+`<button class="loc" data-a="loc" data-i="${i}">${I.pin}<span>${esc(locText(l,own))}</span><i>${I.chev}</i></button>${hwb}</div></div><span class="art ${artOf(l)}"></span></div><button class="add" data-a="hw" data-i="${i}">${I.plus}${hw||ph?'Изменить домашнее задание':'Добавить домашнее задание'}</button>`}).join('')+upd;
}

let pkFac=PR().f,pkProg=prog;
function renderProgs(){
 const f=FAC.find(x=>x[0]===pkFac),fac=FAC.map(([k,n,dev])=>`<button class="chip${k===pkFac?' on':''}${dev?' dev':''}" data-f="${k}">${n}</button>`).join('');
 let h=`<div class="chips">${fac}</div>`;
 if(f[2])h+=`<div class="devbox">${I.cal}<b>Находится в разработке</b>${FACN[pkFac]}: расписание скоро появится</div>`;
 else for(const sp of [...new Set(ALLP.filter(x=>x.f===pkFac).map(x=>x.sp))])h+=`<p class="slbl">${sp}</p><div class="chips">${ALLP.filter(x=>x.f===pkFac&&x.sp===sp).map(x=>`<button class="chip${x.k===pkProg?' on':''}${x.na?' dev':''}" data-p="${x.k}">${x.c} курс</button>`).join('')}</div>`;
 $('pkProg').innerHTML=h;

 $('pkLbl').hidden=$('pkQ').hidden=!ok;return ok}

 if(b.dataset.f){pkFac=b.dataset.f;const f=FAC.find(x=>x[0]===pkFac);if(!f[2]&&!(PROGS[pkProg]&&PROGS[pkProg].f===pkFac))pkProg=(ALLP.find(x=>x.f===pkFac&&!x.na)||{}).k}
 else if(b.dataset.p){if(!PROGS[b.dataset.p]){toast('Расписание этого курса ещё не опубликовано');return}pkProg=b.dataset.p}
 renderPicker()};
function renderPicker(){

 if(mode==='t'){$('pkProg').innerHTML='';$('pkLbl').hidden=$('pkQ').hidden=false;
  const all=[...new Set([...(prog==='st1'?ALLT:[]),...Object.entries(store.tc).filter(([k])=>prog==='st1'?!k.includes('/'):k.startsWith(prog+'/')).map(x=>x[1])])].sort((a,b)=>a.localeCompare(b,'ru'));

  $('pkList').innerHTML=items.map(n=>`<button data-n="${esc(n)}"><b>${esc(n)}</b>${n===teacher?'<span class="chosen">выбран</span>':''}</button>`).join('')||`<div class="pnone">${all.length?'Никого не найдено':'Преподаватели появятся здесь, когда вы укажете их в карточках пар'}</div>`}
 else{
  if(!renderProgs()){$('pkList').innerHTML='';return}
  const dg=q.replace(/\D/g,''),items=R(1,PROGS[pkProg].G).filter(g=>!q||(dg?String(g).includes(dg):('группа '+g).includes(q)));
  $('pkList').innerHTML=items.map(g=>`<button data-g="${g}"><b>Группа ${g}</b>${g===group&&pkProg===prog?'<span class="chosen">выбрана</span>':''}</button>`).join('')||'<div class="pnone">Группа не найдена</div>'}}

async function loadPhoto(f){
 const draw=src=>{const w=src.naturalWidth||src.width,h=src.naturalHeight||src.height;if(!w||!h)throw 0;const k=Math.min(1,1280/Math.max(w,h)),c=document.createElement('canvas');
  c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.72);if(d.length<100)throw 0;return d};
 const viaImg=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{try{ok(draw(i))}catch(e){no(e)}};i.onerror=no;i.src=src});
 try{if(window.createImageBitmap){const bm=await createImageBitmap(f);try{return draw(bm)}finally{bm.close&&bm.close()}}}catch(e){}
 const u=URL.createObjectURL(f);try{return await viaImg(u)}catch(e){}finally{URL.revokeObjectURL(u)}
 const dataUrl=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
 return viaImg(dataUrl)}
$('hwFile').onchange=async()=>{const inp=$('hwFile'),f=inp.files&&inp.files[0];if(!f)return;
 $('hwPhoto').innerHTML='<div class="attach">Загрузка фото…</div>';
 try{hwPhoto=await loadPhoto(f)}catch(e){toast(/hei[cf]/i.test(f.type+f.name)?'Формат HEIC не поддерживается, выберите JPEG':'Не удалось открыть фото')}
 inp.value='';hwPhotoUI()};

 if(!save()){if(pv)store.hw[hwK]=pv;else delete store.hw[hwK];if(pp)store.hwp[hwK]=pp;else delete store.hwp[hwK];toast('Не хватает места на устройстве для фото');return}

 $('tList').innerHTML=list.map(([n,p])=>`<button data-n="${esc(n)}"><b>${esc(n)}</b>${n===curT?'<span class="chosen">выбран</span>':`<span>${esc(p)}</span>`}</button>`).join('')||`<div class="pnone">${all.length?'Никого не найдено. Впишите ФИО ниже':'Список сотрудников кафедры пока не добавлен. Впишите ФИО ниже'}</div>`;
 $('tLbl').textContent=all.length?'Преподаватели кафедры':'Преподаватель'}
function openTeach(l){tk=pkey(group,l);tSubj=l.s;tDept=S[l.s][1]||'';
 $('tTitle').textContent=S[l.s][0];$('tSub').textContent=(l.type==='lec'?'Лекции':TL[l.type][0])+' · группа '+group+' · '+S[l.s][1];
 $('tQ').value='';$('tCustom').value='';$('tClear').hidden=!store.tc[tk];renderTeach();openSheet('tSheet');$('tSheet').querySelector('.panel').scrollTop=0}
const setTeach=n=>{if(n)store.tc[tk]=n;else delete store.tc[tk];save();closeSheet();render();toast(n?'Преподаватель: '+shortName(n):'Преподаватель убран')};
$('tQ').oninput=renderTeach;
$('tList').onclick=e=>{const b=e.target.closest('button[data-n]');if(b)setTeach(b.dataset.n)};
$('tSave').onclick=()=>{const v=$('tCustom').value.trim().replace(/\s+/g,' ');if(!v)return;
 if(tDept&&!teachList().some(x=>x[0]===v)){(store.ct[tDept]=store.ct[tDept]||[]).push(v)}setTeach(v)};
$('tCustom').onkeydown=e=>{if(e.key==='Enter')$('tSave').click()};
$('tClear').onclick=()=>setTeach('');

// где проходит пара
const ymap=a=>'https://yandex.ru/maps/65/novosibirsk/?text='+encodeURIComponent('Новосибирск, '+a);
const gmap=a=>'https://2gis.ru/novosibirsk/search/'+encodeURIComponent(a);
const fmtR=a=>{const r=[...a].sort((x,y)=>x-y),o=[];for(let i=0;i<r.length;){let j=i;while(j+1<r.length&&r[j+1]===r[j]+1)j++;o.push(j-i>=2?r[i]+'–'+r[j]:j>i?r[i]+', '+r[j]:''+r[i]);i=j+1}return o.join(', ')};
const roomSort=(a,b)=>{const na=/^\d/.test(a),nb=/^\d/.test(b);return na&&nb?parseInt(a)-parseInt(b)||a.localeCompare(b):na?1:nb?-1:a.localeCompare(b,'ru')};
const roomsOf=a=>[...new Set([...((BA[a]||[])[3]||[]),...(store.cr[a]||[])])].sort(roomSort);
const routes=a=>`<div class="routes"><a href="${ymap(a)}" target="_blank" rel="noopener">Яндекс Карты</a><a href="${gmap(a)}" target="_blank" rel="noopener">2ГИС</a></div>`;
let wk=null,wl=null,wa=null,wr=null,wx=false,wt='';
function wRender(){
 let h=`<p class="slbl">Корпус НГМУ</p><div class="blist">`+BL.map(([ad,nm])=>`<button class="bopt${wa===ad&&!wx?' on':''}" data-b="${esc(ad)}"><span><b>${esc(nm)}</b><small>${esc(ad)}</small></span></button>`).join('')
  +`<button class="bopt${wx?' on':''}" data-b="x"><span><b>Другое место</b><small>Больница, поликлиника или другой адрес: впишите сами</small></span></button></div>`;
 if(wx)h+=`<p class="slbl">Где проходит пара</p><input class="sin" id="wTxt" placeholder="Название и адрес" autocomplete="off" value="${esc(wt)}">`;
 else if(wa){const rs=roomsOf(wa);
  h+=`<p class="slbl">Аудитория · ${esc(bShort(wa))}</p><div class="rgrid">`+rs.map(r=>`<button class="ropt${wr===r?' on':''}" data-r="${esc(r)}">${esc(r)}</button>`).join('')
   +`<button class="ropt add" data-r="+">+ Другая</button></div>`
   +`<div class="cust" id="wAddBox" hidden><input class="sin" id="wAdd" placeholder="Номер или название" autocomplete="off"><button id="wAddOk">Добавить</button></div>`
   +`<div class="wb"><b>${esc(BA[wa]?BA[wa][1]:wa)}</b><span>${esc(wa)}</span>${wr?`<p class="wr"><i>Аудитория</i>${esc(wr)}</p>`:''}${routes(wa)}</div>`}
 else h+=`<p class="whint">Выберите корпус, и появится список аудиторий и маршрут</p>`;
 h+=`<p class="wsrc">Корпуса указаны по сайту НГМУ, аудитории взяты из справки НГМУ о материально-техническом обеспечении (файл от 07.04.2021). Если вашей аудитории нет, добавьте её кнопкой «+ Другая».</p>`;
 $('wBody').innerHTML=h;
 $('wSave').disabled=wx?!wt.trim():!wa;
 const t=$('wTxt');if(t)t.oninput=()=>{wt=t.value;$('wSave').disabled=!wt.trim()}}
function openLoc(l){wk=pkey(group,l);wl=l;const lec=l.type==='lec',own=store.loc[wk],sp=schedPlace(l);
 $('wTitle').innerHTML=esc(S[l.s][0])+parity(l);$('wSub').textContent=(lec?'Лекция':TL[l.type][0])+' · группа '+group+' · в расписании: '+(sp||'место не указано');
 wx=!!(own&&own.x);wt=own&&own.t||'';wa=own&&own.a||null;wr=own&&own.r||null;
 if(wa&&wr&&!roomsOf(wa).includes(wr))(store.cr[wa]=store.cr[wa]||[]).push(wr);
 $('wClr').hidden=!own;wRender();openSheet('wSheet');$('wSheet').querySelector('.panel').scrollTop=0}
$('wBody').onclick=e=>{const bo=e.target.closest('[data-b]'),ro=e.target.closest('[data-r]');
 if(bo){const v=bo.dataset.b;if(v==='x'){wx=true}else{wx=false;if(v!==wa){wa=v;wr=null}}wRender();haptic();return}
 if(ro){if(ro.dataset.r==='+'){$('wAddBox').hidden=false;$('wAdd').focus();return}wr=wr===ro.dataset.r?null:ro.dataset.r;wRender();haptic();return}
 if(e.target.id==='wAddOk'){const v=$('wAdd').value.trim().replace(/\s+/g,' ');if(!v)return;if(!roomsOf(wa).includes(v))(store.cr[wa]=store.cr[wa]||[]).push(v);wr=v;save();wRender()}};
$('wBody').addEventListener('keydown',e=>{if(e.target.id==='wAdd'&&e.key==='Enter')$('wAddOk').click()});
$('wSave').onclick=()=>{if(wx){if(!wt.trim())return;store.loc[wk]={x:1,t:wt.trim()}}else{if(!wa)return;store.loc[wk]={a:wa,r:wr||null}}delete store.rm[wk];save();closeSheet();render();toast('Место сохранено')};
$('wClr').onclick=()=>{delete store.loc[wk];delete store.rm[wk];save();closeSheet();render();toast('Выбор сброшен')};

// нижняя панель
let view='s';
function showView(v){view=v;const m=v==='m';document.querySelector('.app').hidden=m;$('mapView').hidden=!m;
 $('today').classList.toggle('off',m);$('mapBtn').classList.toggle('off',!m);if(m)renderMap();scrollTo({top:0});$('bar').classList.remove('min')}
function renderMap(){const tm=store.mode==='t',use={};
 if(!tm){const seen=new Set();for(let d=new Date(MINW);d<=new Date(+MAXW+6*864e5);d=new Date(+d+864e5))for(const l of lessons(group,d)){const k=pkey(group,l);if(seen.has(k))continue;seen.add(k);
  const own=store.loc[k];if(own&&own.a)(use[own.a]=use[own.a]||[]).push([S[l.s][0]+(l.type==='lec'?', лекции':''),own.r?roomTxt(own.r):''])}}
 const card=(ad,u)=>`<div class="wb"><b>${esc(BA[ad]?BA[ad][1]:ad)}</b><span>${esc(ad)}</span>${u?`<div class="subj">${u.sort((a,b)=>a[0].localeCompare(b[0],'ru')).map(x=>`<p>${esc(x[0])}${x[1]?` <i>· ${esc(x[1])}</i>`:''}</p>`).join('')}</div>`:''}${routes(ad)}</div>`;
 const mine=Object.keys(use),rest=BL.map(x=>x[0]).filter(a=>!use[a]);
 $('mapSub').textContent=tm?'Корпуса НГМУ':(mine.length?'Адреса, которые вы выбрали для пар группы '+group:'Выберите корпус в карточке пары, и он появится здесь');
 $('mapList').innerHTML=mine.map(a=>card(a,use[a])).join('')+(mine.length?'<p class="mh">Другие корпуса</p>':'')+rest.map(a=>card(a)).join('')}
$('today').onclick=()=>{if(view!=='s'){showView('s');return}sel=day0(new Date());render();scrollTo({top:0,behavior:'smooth'});$('bar').classList.remove('min')};
$('mapBtn').onclick=()=>{if(view!=='m')showView('m')};
let lastY=scrollY;
addEventListener('scroll',()=>{const y=scrollY,d=y-lastY;if(y<40||d<-6)$('bar').classList.remove('min');else if(d>6)$('bar').classList.add('min');lastY=y},{passive:true});
$('barHandle').onclick=()=>$('bar').classList.toggle('min');

// обновление статуса раз в минуту и при возврате в приложение
setInterval(()=>{if(!openSh)render()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!openSh)render()});
render();
if(!store.g)openPicker();
cloudLoad(()=>{prog=PROGS[store.p]?store.p:'st1';group=store.g||group;mode=store.mode==='t'?'t':'g';teacher=store.teacher||'';if(!openSh)render();if(store.g&&openSh==='pick')closeSheet()});
}
</script>
</body>
